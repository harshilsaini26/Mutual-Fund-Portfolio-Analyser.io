# by learn.py: read its docstring before editing. Every entry is written in this
# project's own words; nothing is copied or quoted from a source. Each source
# below is a page that was read on the date given.
#
# Investopedia is on the allowed list but cited nowhere yet: its site refuses
# the automated reader this content was researched with, and an entry cites
# only a page that was actually read.

